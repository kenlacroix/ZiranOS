# GRUB configuration baked into the bootable ISO.
#
# `multiboot2` tells GRUB to load our kernel using the Multiboot2 protocol --
# matching the header in boot/multiboot_header.asm -- and `boot` transfers
# control to it. A five-second menu is plenty for a one-entry OS.

set timeout=5
set default=0

menuentry "Ziran OS" {
    multiboot2 /boot/kernel.bin
    boot
}
