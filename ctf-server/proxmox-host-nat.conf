# Proxmox HOST config for isolating the Tier-2 CTF VM on a FLAT network (no VLANs).
#
# Append this stanza to /etc/network/interfaces on the Proxmox host, then
# `ifreload -a` (or reboot). It creates an internal-only bridge with NO uplink, so
# the VM is L2-isolated from your flat LAN, and NATs that subnet to the internet
# while DROPPING any forwarding to private/LAN ranges. Result: the VM can reach the
# internet (for the cloudflared tunnel) and NOTHING on your LAN — a guest breakout
# lands on an island whose only exit is WAN.
#
# Then: attach the VM's single NIC to vmbr1, set it static 10.66.66.2/24,
# gateway 10.66.66.1, DNS 1.1.1.1. Verify inside the VM:
#   curl -I https://cloudflare.com   # works
#   ping 192.168.x.x  (your NAS/router)   # times out  <-- the island is correct
#
# Edit the subnet (10.66.66.0/24) and your uplink bridge (vmbr0) if they differ.

auto vmbr1
iface vmbr1 inet static
    address 10.66.66.1/24        # the VM's gateway; the VM gets 10.66.66.2/24
    bridge-ports none            # NO physical port -> isolated from the flat LAN
    bridge-stp off
    bridge-fd 0
    post-up   sysctl -w net.ipv4.ip_forward=1
    # NAT the CTF subnet out to the internet via the LAN uplink:
    post-up   iptables -t nat -A POSTROUTING -s 10.66.66.0/24 -o vmbr0 -j MASQUERADE
    post-down iptables -t nat -D POSTROUTING -s 10.66.66.0/24 -o vmbr0 -j MASQUERADE
    # THE ISLAND: drop CTF-subnet -> any private/LAN range; public WAN falls through.
    # (VM own-subnet + gateway traffic is local, not forwarded, so it's unaffected.)
    post-up   iptables -A FORWARD -s 10.66.66.0/24 -d 192.168.0.0/16 -j DROP
    post-up   iptables -A FORWARD -s 10.66.66.0/24 -d 10.0.0.0/8      -j DROP
    post-up   iptables -A FORWARD -s 10.66.66.0/24 -d 172.16.0.0/12   -j DROP
    post-down iptables -D FORWARD -s 10.66.66.0/24 -d 192.168.0.0/16 -j DROP
    post-down iptables -D FORWARD -s 10.66.66.0/24 -d 10.0.0.0/8      -j DROP
    post-down iptables -D FORWARD -s 10.66.66.0/24 -d 172.16.0.0/12   -j DROP

# Optional hardening — restrict egress to Cloudflare only (so the VM reaches nothing
# but the tunnel): replace the WAN allow with ACCEPTs to Cloudflare's published IPv4
# ranges (https://www.cloudflare.com/ips/) + DNS, and set FORWARD policy for the
# subnet to DROP. Overkill for launch, but the tightest you can get.
